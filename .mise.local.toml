[tasks."lint:ts"]
description = "Checks JavaScript with Biome"
run = ["biome check ."]

# Shared setup:ts and test:ts defaults use npm, but these proxies have no dependencies
[tasks."setup:ts"]
description = "Nothing to install: the plugins' Node proxies have no npm dependencies"
run = ":"

[tasks."test:ts"]
description = "Run the test harness (the test gate's make test)"
run = ["bash tests/run.sh"]

[tasks.live-setup]
description = "Install the LSP servers the live cases drive (they skip without them)"
# The cue and regal installers fall back to ~/.local/bin and then check PATH.
run = '''
set -e
export PATH="$HOME/.local/bin:$PATH"
bash pyright/hooks/check-pyright.sh
bash bash-language-server/hooks/check-bash-language-server.sh
bash vtsls/hooks/check-vtsls.sh
bash cue-lsp/hooks/check-cue.sh
bash regal-lsp/hooks/check-regal.sh
'''
