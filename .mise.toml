# .mise.toml — task runner contract (§6.3: `mise run lint`, `mise run test`, `mise run e2e`, `mise run build`)
# Backend-prefixed pins (`npm:`, `aqua:`, `github:`) live here, not in .tool-versions.

[tools]
# uv — declared FIRST because the `pipx:` pins below cannot install without it
# and every task in this file shells out to it (`uv lock --check`,
# `uv run --frozen …`). mise's pipx backend routes installs through uvx
# (`pipx.uvx` defaults true); with neither uv nor a real pipx binary present,
# `mise install` hard-fails with "pipx is required to install pipx:<tool> but
# was not found" and every downstream hook dies with command-not-found.
#
# Until 2026-09-03 this dependency was UNDECLARED: uv reached CI only via an
# `astral-sh/setup-uv` step each workflow had to remember, and reached laptops
# only via a developer's global install. That made green runs a property of the
# runner image and the mise cache rather than of this file — 20 of 58 repos
# carried a test-gate with no uv step, of which 4 were outright red and 16
# passed only because they happened to land on a runner that already had it.
# Declaring it here makes provisioning mise's job, so the workflow-level
# setup-uv steps become belt-and-braces instead of load-bearing.
#
# Version tracks the pin the injected gates install (astral-sh/setup-uv v8.3.2
# → uv 0.12.1); Renovate's mise manager bumps it here.
uv = "0.12.1"

# commitlint via mise's npm: backend so the binary lands on PATH across every
# archetype. Earlier the template assumed TS consumers carried commitlint as a
# package.json devDep, but Pattern E preserves the consumer's package.json
# (`_skip_if_exists`), so the assumption broke. mise pinning is the consistent
# audit-side contract — same as how gitleaks/conftest/check-jsonschema work.
"npm:@commitlint/cli" = "21.2.1"
"npm:@commitlint/config-conventional" = "21.2.0"

# Hook tools backing lefthook.yml. Universal across archetypes — every
# archetype's lefthook runs markdownlint/yamllint/prettier and most run
# shellcheck/shfmt. Pinning here is the only way `lefthook run` can
# resolve these binaries on a fresh CI runner (and via `mise exec --` locally
# without polluting the developer's global tool surface).
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:mvdan/sh"            = "3.13.1"   # shfmt
# 2026-08-28: remove this exact fastq exclude once the selected fastq release publishes SLSA provenance.
"npm:markdownlint-cli2" = { version = "0.23.1", trust_policy_excludes = ["fastq@1.20.2"] }
"npm:prettier"             = "3.9.6"
"pipx:yamllint"            = "1.38.0"
# lefthook binary itself. The lint-hooks CI job runs `mise exec -- lefthook
# run pre-commit --all-files`, which requires lefthook on PATH from mise (the
# CI runner doesn't carry it natively). Locally developers usually have
# lefthook via Homebrew; pinning here keeps CI and the developer-laptop
# parity. The audit-side .standards/.mise.toml does NOT pin lefthook because
# audit.yml doesn't invoke it — only consumer-side lint-hooks does.
"aqua:evilmartians/lefthook" = "2.1.10"
# gitleaks here mirrors the audit-side pin in .standards/.mise.toml. The
# lefthook pre-commit gitleaks hook invokes a bare `gitleaks git --staged`,
# which needs the binary on PATH — the consumer-side lint-hooks CI job
# doesn't materialize .standards/ so cannot rely on that pin.
"aqua:gitleaks/gitleaks"     = "8.30.1"
# yq — used by the `_tasks` merge-yamllint.sh hook to deep-merge consumer-side
# .yamllint.local into the template-rendered .yamllint at copier render time.
# Pinning universally so consumers can rely on it for their own scripts too.
"aqua:mikefarah/yq"          = "4.53.3"
# copier — the weekly copier-sync reusable workflow (.github/copier-sync.yml)
# runs a bare `copier update`, bootstrapping tools via mise-action. The CI
# runner image does not ship copier, so without this pin the sync job exits
# 127 (command not found). Pinning here lands it on the mise PATH for both CI
# and local `copier update` parity. The reusable workflow also installs copier
# explicitly as belt-and-braces for consumers not yet re-rendered with this pin.
"pipx:copier"                = "9.17.0"
# Node runtime pin — universal (P5-C unification). Every repo runs the
# npm:-backend hook tools above (commitlint / markdownlint / prettier), so the
# node runtime they require is pinned HERE for every repo. Previously most
# repos carried this pin in .tool-versions; that file now holds only the
# python/go pins (ASDF-format toolchains with no backend prefix) and renders
# only when one of those stacks is present.
node = "22.12.0"
# Biome 2.x — JS/TS language facets (has_javascript or has_typescript,
# including ts-web-angular). This pin is
# LOAD-BEARING: both the lefthook `biome` pre-commit hook and the lint-format
# CI gate invoke `mise exec -- biome`, resolving this exact version. (The hook
# previously used bare `npx biome`, which silently resolved the abandoned npm
# registry package named `biome` whenever no consumer devDep was installed.)
# Also pinned for any non-TS archetype when has_embedded_web=true
# so the embedded web surface (JS/JSX/TS/CSS) gets the same Biome floor as a
# standalone ts-* repo (e.g. vibetunnel Swift + Node, todoist-classify Python +
# React/JSX).
#
# Note for ts-web-angular: the template pins Biome and renders `biome.jsonc`
# uniformly with ts-web. The audit-side override-policy Rego rule that "scripts.lint
# invokes biome" is relaxed for Angular repos (policy/typescript/overrides.rego's
# `is_angular_repo` bypass) so consumers running `ng lint` still pass — but the
# template no longer withholds biome.jsonc from Angular consumers who legitimately
# want Biome alongside ESLint (e.g. super-productivity's `scripts.lint: "biome
# check ."`). Consumers who don't want Biome can delete biome.jsonc; `_skip_if_exists`
# keeps it from coming back on `copier update`.
"npm:@biomejs/biome"       = "2.5.5"

# Git hooks are per-repo via lefthook since dotfiles commit 2ea15ce retired the
# global dispatcher. Local `mise install` activates them without `mise
# activate`. CI never fires Git hooks; `lint-hooks` runs `lefthook run` with a
# routed standards token. Ungated CI clones the private standards remote
# anonymously, and macOS Tart GCM can wait forever (sshfsctl PR #18, run
# 33554743280, 2026-09-01). Precedents: the v1.55.2-wave fix in
# Rubio-Enterprises/.github lint-hooks.yml and mac-dev-playbook
# config_outrunner.cue #295. Linux hid it because mise only warns on hook
# failure.
[hooks]
postinstall = 'test -n "${CI:-}" || mise exec -- lefthook install'

# Regenerate the GENERATED lint configs (floor ⊕ this repo's `*.local`
# sidecars) without a full `copier update`. Universal rather than facet-gated:
# every onboarded repo carries `.yamllint` + `.markdownlint-cli2.jsonc`, and the
# stack facets add `ruff.toml` / `biome.jsonc` on top.
#
# Invoked through `bash` rather than the script's own exec bit: copier strips
# exec bits from rendered files (see the chmod-claude-scripts.sh rationale in
# copier.yml's `_tasks` block), so relying on it would break on a fresh render.
[tasks.lint-config]
description = "Regenerate generated lint configs from the standards floor + this repo's *.local sidecars"
run = ["bash scripts/regenerate-lint-config.sh"]
# TS archetypes: tasks delegate to package.json scripts (the consumer owns
# package.json per Pattern A/D / _skip_if_exists). The audit Layer B JSON
# Schema enforces that lint, test, e2e exist in scripts; this contract makes
# `mise run <task>` the uniform invocation across all archetypes regardless
# of how the underlying TS toolchain is wired.
[tasks.lint]
description = "Delegates to scripts.lint in package.json"
run = ["npm run lint"]

[tasks.typecheck]
# Strict TS type-check (§ type-checking floor). Delegates to scripts.typecheck
# in package.json (`tsc --noEmit`, or `astro check` for astro repos) — added by
# the ensure-pkg-typecheck-script.sh _tasks hook and required by
# package-json.schema.json for ts-* archetypes. The rendered standards.yml
# `typecheck` job invokes `astro check` directly when astro.config.* is present
# and otherwise runs `npm run typecheck` (this task's delegate). [tasks.lint]
# above only runs `npm run lint`, which historically did NOT run tsc — this is
# the task that makes `mise run typecheck` a uniform local invocation matching
# the CI gate.
# --if-present: this task renders for EVERY ts-* archetype, but the
# ensure-pkg-typecheck-script.sh hook (and package-json.schema.json) only add/
# require scripts.typecheck when `typescript` is an actual (dev)dependency. A
# JS-only ts-* repo (fleet-live: the claude-statusline fork) otherwise
# hard-fails the typecheck gate on `npm error Missing script: "typecheck"`
# with nothing to typecheck. Layer B still requires the script wherever
# typescript IS a dependency, so this cannot mask a missing check there.
description = "Delegates to scripts.typecheck in package.json (tsc --noEmit; `astro check` for astro repos)"
run = ["npm run --if-present typecheck"]

[tasks.test]
description = "Delegates to scripts.test in package.json"
run = ["npm run test"]

[tasks.build]
description = "Delegates to scripts.build in package.json"
run = ["npm run build"]
