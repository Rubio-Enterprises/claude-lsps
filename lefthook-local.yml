# Malformed LSP fixtures are test data, not shell or YAML source
pre-commit:
  jobs:
    - name: fixers
      group:
        jobs:
          - name: repo-scope
            group:
              jobs:
                - name: shfmt
                  group:
                    jobs:
                      - name: invoke
                        exclude:
                          - tests/fixtures/**
                - name: yaml-prettier
                  group:
                    jobs:
                      - name: invoke
                        exclude:
                          - tests/fixtures/**
  commands:
    shellcheck:
      exclude:
        - "tests/fixtures/**"
