# lefthook.local.yml — repo-local overrides for the standards-template lefthook.yml.
#
# ShellCheck rules live in .shellcheckrc, so local hooks and CI use the
# same suppressions without replacing the standards command.
#
# Fixture exclusion (shellcheck, shfmt, yaml-prettier): tests/fixtures/** holds
# deliberately-malformed inputs fed to the live LSP suite — e.g. bash/broken.sh
# has an intentional parse error — so
# the org-floor lint/format hooks must skip them, and shfmt/prettier
# `stage_fixed` rewrites must not mutate the crafted inputs. shellcheck and
# shfmt have no native file-ignore mechanism, so lefthook `exclude` is the only
# layer that works; yaml-prettier follows the template's own convention of
# listing file exclusions here (cf. its lockfile/action.yml `exclude` in
# lefthook.yml) rather than in a `.prettierignore`. The yamllint exclusion is
# NOT here — it lives natively in .yamllint / .yamllint.local, matching the
# template's convention for that tool. lefthook merges `exclude` lists by
# REPLACEMENT, so the yaml-prettier override below restates the template's
# base entries verbatim (source of truth: standards lefthook/base.yml) ahead
# of the fixture entry. This repo ships no lockfiles or vendored action.yml,
# but `.copier-answers.yml` is Copier's own state file in every rendered repo
# and prettier rewriting its `''` to `""` thrashes against each re-render.
#
# Listed in the template's `_skip_if_exists`, so `copier update` won't clobber
# this file.
pre-commit:
  commands:
    shellcheck:
      exclude:
        - "tests/fixtures/**"
    shfmt:
      exclude:
        - "tests/fixtures/**"
    yaml-prettier:
      exclude:
        - "{,**/}pnpm-lock.yaml"
        - "{,**/}package-lock.json"
        - "{,**/}yarn.lock"
        - ".github/actions/**/action.yml"
        - ".copier-answers.yml"
        - "tests/fixtures/**"
